<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Leave Portal</title>
<meta name="theme-color" content="#0F5C63">
<style>
  :root{--teal:#0F5C63;--teal2:#2A8084;--mint:#D6ECE9;--mint2:#E8F4F1;--pale:#C4E2DE;--dark:#183438;--sand:#E9C478;--grey:#5A6C6E}
  *{box-sizing:border-box;margin:0}
  body{font-family:"Segoe UI",Inter,system-ui,-apple-system,Arial,sans-serif;color:var(--dark);
       background:linear-gradient(#F0F8F6,#D6ECE9);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{position:relative;overflow:hidden;width:100%;max-width:440px;background:#fff;border-radius:28px;
        box-shadow:0 10px 40px rgba(15,92,99,.15);padding:40px 32px 36px;text-align:center}
  .card::before,.card::after{content:"";position:absolute;border-radius:50%;background:var(--mint2);z-index:0}
  .card::before{width:260px;height:220px;left:-120px;top:-110px}
  .card::after{width:220px;height:180px;right:-110px;bottom:-110px}
  .card>*{position:relative;z-index:1}
  .logo{width:76px;height:76px;margin:0 auto 18px;display:block}
  .scene{width:100%;max-width:330px;height:auto;margin:0 auto 18px;display:block}
  h1{font-size:44px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
  .sub{font-size:19px;color:var(--grey);margin-bottom:30px}
  .label{font-size:16px;color:var(--dark);margin:0 0 10px}
  .btn{display:block;width:100%;padding:17px 20px;border-radius:16px;font-size:20px;font-weight:700;text-decoration:none;
       transition:transform .08s ease,box-shadow .15s ease,background .15s ease}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--teal);color:#fff;box-shadow:0 4px 14px rgba(15,92,99,.25);margin-bottom:24px}
  .btn-primary:hover{background:#0B4A50}
  .btn-outline{border:2px solid var(--teal);color:var(--teal);background:#fff}
  .btn-outline:hover{background:var(--mint2)}
  .foot{margin-top:26px;font-size:13px;color:var(--grey);line-height:1.5}
</style>
</head>
<body>
<main class="card">
  <!-- Logo: hard hat (swap for your company logo: <img class="logo" src="logo.png" alt="Company logo">) -->
  <svg class="logo" viewBox="0 0 512 512" role="img" aria-label="Staff Leave Portal">
    <rect width="512" height="512" rx="110" fill="#0F5C63"/>
    <path d="M96 280a160 160 0 0 1 320 0z" fill="#E9C478"/>
    <rect x="50" y="262" width="412" height="54" rx="20" fill="#E9C478"/>
    <rect x="238" y="128" width="36" height="148" fill="#D6AA5A"/>
  </svg>

  <!-- Illustration: piling rig + leave calendar -->
  <svg class="scene" viewBox="0 -12 660 342" aria-hidden="true">
    <g fill="#D6ECE9">
      <rect x="20" y="110" width="70" height="190"/><rect x="100" y="60" width="60" height="240"/>
      <rect x="440" y="90" width="70" height="210"/><rect x="520" y="40" width="55" height="260"/><rect x="585" y="130" width="60" height="170"/>
    </g>
    <g fill="#E8F4F1">
      <rect x="32" y="130" width="10" height="14"/><rect x="54" y="130" width="10" height="14"/><rect x="32" y="166" width="10" height="14"/><rect x="54" y="166" width="10" height="14"/>
      <rect x="112" y="80" width="10" height="14"/><rect x="134" y="80" width="10" height="14"/><rect x="112" y="116" width="10" height="14"/><rect x="134" y="116" width="10" height="14"/>
      <rect x="532" y="60" width="10" height="14"/><rect x="554" y="60" width="10" height="14"/><rect x="532" y="96" width="10" height="14"/><rect x="554" y="96" width="10" height="14"/>
    </g>
    <rect x="0" y="292" width="660" height="34" rx="17" fill="#C4E2DE"/>
    <!-- pile + cable -->
    <rect x="276" y="60" width="14" height="250" fill="#E9C478"/><rect x="273" y="54" width="20" height="12" fill="#183438"/>
    <line x1="241" y1="0" x2="283" y2="54" stroke="#183438" stroke-width="3"/>
    <!-- rig -->
    <line x1="140" y1="222" x2="228" y2="65" stroke="#2A8084" stroke-width="8"/>
    <rect x="40" y="245" width="260" height="47" rx="23" fill="#183438"/>
    <g fill="#2A8084"><circle cx="68" cy="269" r="14"/><circle cx="114" cy="269" r="14"/><circle cx="160" cy="269" r="14"/><circle cx="206" cy="269" r="14"/><circle cx="252" cy="269" r="14"/></g>
    <rect x="60" y="172" width="195" height="75" rx="10" fill="#0F5C63"/>
    <rect x="80" y="185" width="60" height="40" rx="6" fill="#D6ECE9"/>
    <rect x="165" y="195" width="50" height="10" fill="#2A8084"/>
    <rect x="228" y="20" width="26" height="228" fill="#0F5C63"/>
    <polygon points="220,20 262,20 241,-5" fill="#0F5C63"/>
    <!-- calendar -->
    <rect x="430" y="125" width="200" height="170" rx="18" fill="#fff" stroke="#C4E2DE" stroke-width="3"/>
    <path d="M448 125h164a18 18 0 0 1 18 18v28H430v-28a18 18 0 0 1 18-18z" fill="#0F5C63"/>
    <rect x="464" y="110" width="12" height="34" rx="6" fill="#183438"/><rect x="584" y="110" width="12" height="34" rx="6" fill="#183438"/>
    <g fill="#E8F4F1">
      <rect x="448" y="186" width="30" height="26" rx="6"/><rect x="492" y="186" width="30" height="26" rx="6"/><rect x="536" y="186" width="30" height="26" rx="6"/><rect x="580" y="186" width="30" height="26" rx="6"/>
      <rect x="448" y="224" width="30" height="26" rx="6"/><rect x="492" y="224" width="30" height="26" rx="6"/>
      <rect x="448" y="262" width="30" height="20" rx="6"/><rect x="492" y="262" width="30" height="20" rx="6"/>
    </g>
    <circle cx="583" cy="250" r="33" fill="#2EA078"/>
    <polyline points="567,250 579,263 600,236" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <h1>Welcome!</h1>
  <p class="sub">Do you already have an account?</p>

  <p class="label">I have an account</p>
  <a class="btn btn-primary" href="https://forms.cloud.microsoft/r/EagjjT96hu">Log in</a>

  <p class="label">I'm new here</p>
  <a class="btn btn-outline" href="https://forms.cloud.microsoft/r/MiJBEXHqrL">Register</a>

  <p class="foot">Staff Leave Portal · Use your personal email address.<br>Need help? Contact HR.</p>
</main>
</body>
</html>
